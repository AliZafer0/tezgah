<!doctype html>
<html lang="tr" data-mode="loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Binary Bloom</title>
  <meta name="description" content="0 ve 1'lerden filizlenen, etkileşimli üç boyutlu bir gül.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#030203">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <main class="piece">
    <canvas class="scene" tabindex="0" role="img"
      aria-label="Siyah bir boşlukta, yalnızca 0 ve 1 karakterlerinden oluşan, yavaşça açılan üç boyutlu kırmızı bir gül."
      aria-describedby="drag-hint" data-canvas></canvas>

    <picture class="fallback" data-fallback hidden>
      <source media="(orientation: portrait)" data-srcset="fallback.jpg">
      <img data-src="cover.jpg" alt="0 ve 1 karakterlerinden oluşan açık kırmızı bir gülün durağan görüntüsü.">
    </picture>

    <header class="title">
      <h1>Binary Bloom</h1>
      <p>Koddan filizlenen bir gül.</p>
    </header>

    <p class="hint" id="drag-hint" data-hint>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M4 12l3-3M4 12l3 3M20 12l-3-3M20 12l-3 3" /></svg>
      <span>Sürükleyerek çevresinde dön</span>
    </p>

    <p class="fallback-note" data-fallback-note hidden>Bu cihazda 3D görünüm açılamadı; gülün durağan hâli gösteriliyor.</p>

    <section class="controls" aria-label="Gül kontrolleri" data-controls>
      <div class="bloom-range">
        <label for="bloom">Açılma</label>
        <input id="bloom" type="range" min="0" max="100" step="1" value="0" data-bloom>
        <output for="bloom" data-bloom-value>%0</output>
      </div>
      <div class="buttons">
        <button type="button" data-action="play">
          <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="pause"><path d="M9 6v12M15 6v12" /></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="play" hidden><path d="M8 5.5v13l10.5-6.5z" /></svg>
          <span data-label>Duraklat</span>
        </button>
        <button type="button" data-action="scatter">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1.6" /><circle cx="5" cy="7" r="1.1" /><circle cx="19" cy="6" r="1.1" /><circle cx="6" cy="18" r="1.1" /><circle cx="18" cy="17" r="1.1" /></svg>
          <span data-label>Dağıt</span>
        </button>
        <button type="button" data-action="restart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5" /><path d="M5 4.5V8h3.5" /></svg>
          <span>Baştan başlat</span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
