# Örnek Apache yapılandırması — Tezgâh galerisi
# Apache, `npm run build` çıktısı olan dist/ klasörünü statik olarak sunar; Node süreci gerekmez.
# Güvenlik başlıkları scripts/lib/http.mjs ile aynıdır (docs/gelistirme.md: "Önizleme, izinler ve güven sınırı").
# Kullanım: alan adını ve yolu kendine göre değiştir, /etc/apache2/sites-available/ altına kopyala,
#   a2ensite tezgah && apache2ctl configtest && systemctl reload apache2
# TLS'i önünde bir vekil (ör. Cloudflare) sağlıyorsa port 80 yeterlidir; değilse :443 için bir eş blok ekle.
<VirtualHost *:80>
    ServerName https://tezgah.example.com
    # Dizin yönlendirmeleri (/projects/x → /projects/x/) https ile yazılsın
    UseCanonicalName On
    DocumentRoot /var/www/tezgah/dist
    DirectoryIndex index.html

    <Directory /var/www/tezgah/dist>
        Options -Indexes -FollowSymLinks -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    # Nokta ile başlayan hiçbir dosya sunulmaz
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    AddType text/javascript .mjs
    AddType application/wasm .wasm
    AddType model/gltf-binary .glb
    AddType model/gltf+json .gltf

    Redirect 301 /favicon.ico /favicon.svg

    <IfModule mod_headers.c>
        Header always set X-Robots-Tag "noindex, nofollow"
        Header always set X-Content-Type-Options "nosniff"

        # Galeri
        Header always set Referrer-Policy "same-origin"
        Header always set X-Frame-Options "DENY"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'none'"
        Header set Cache-Control "no-cache"

        <LocationMatch "^/assets/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </LocationMatch>

        # Projeler: opak origin (allow-same-origin yok), yalnızca aynı siteden çerçevelenebilir
        <LocationMatch "^/projects/">
            Header always unset X-Frame-Options
            Header always set Content-Security-Policy "sandbox allow-scripts allow-pointer-lock allow-popups allow-modals allow-forms allow-downloads; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
            Header always set Access-Control-Allow-Origin "*"
            Header always set Cross-Origin-Resource-Policy "cross-origin"
            Header always set Referrer-Policy "no-referrer"
            Header set Cache-Control "no-cache"
        </LocationMatch>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/tezgah-error.log
    CustomLog ${APACHE_LOG_DIR}/tezgah-access.log combined
</VirtualHost>
